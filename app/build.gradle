plugins {
    // Apply the application plugin to add support for building a CLI application in Java.
    id 'application'
}

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
    maven { url 'https://frcmaven.wpi.edu/artifactory/release/' }
}

dependencies {
    // Use JUnit Jupiter for testing.
    testImplementation libs.junit.jupiter

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // This dependency is used by the application.
    implementation libs.guava
    
    // JSON parsing for Gson
    implementation libs.gson
    
    // WPILib NT4
    implementation 'edu.wpi.first.ntcore:ntcore-java:2024.3.2'
    implementation 'edu.wpi.first.wpiutil:wpiutil-java:2024.3.2'
    runtimeOnly 'edu.wpi.first.ntcore:ntcore-jni:2024.3.2:windowsx86-64'
    runtimeOnly 'edu.wpi.first.wpiutil:wpiutil-jni:2024.3.2:windowsx86-64'
}

// Apply a specific Java toolchain to ease working on different environments.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

application {
    // Define the main class for the application.
    mainClass = 'limelight.LimelightSimulator'
}

// Task to create a fat JAR with all dependencies
tasks.register('fatJar', Jar) {
    archiveBaseName = 'LimelightSim'
    archiveVersion = '1.0'
    archiveClassifier = 'all'
    duplicatesStrategy = 'exclude'
    manifest {
        attributes 'Main-Class': 'limelight.LimelightSimulator'
    }
    from sourceSets.main.output
    dependsOn configurations.runtimeClasspath
    from {
        configurations.runtimeClasspath.findAll { it.name.endsWith('jar') }.collect { zipTree(it) }
    }
}

tasks.named('test') {
    // Use JUnit Platform for unit tests.
    useJUnitPlatform()
}
